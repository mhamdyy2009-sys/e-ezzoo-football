
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الكورة مع عزو</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101510;color:white;font-family:Arial}
header{background:#17251a;padding:22px;text-align:center;border-bottom:2px solid #20c45a}
h1{color:#20df68;margin:0}
nav{display:flex;justify-content:space-around;background:#1b241d;padding:14px}
button{background:#20c45a;color:#07130a;border:0;padding:11px;border-radius:9px;font-weight:bold}
main{padding:15px}
.card{background:#202b22;padding:17px;border-radius:13px;margin:13px 0}
h2{color:#36e879}
.small{color:#aeb9af}
</style>
</head>
<body>
<header>
<h1>⚽ الكورة مع عزو</h1>
<p>كل أخبار ونتائج كرة القدم</p>
</header>
<nav>
<button onclick="show('home')">الرئيسية</button>
<button onclick="show('matches')">المباريات</button>
<button onclick="show('tables')">الترتيب</button>
</nav>
<main id="content">
<div class="card">
<h2>أهلاً بيك في الكورة مع عزو 💚</h2>
<p>تابع عالم كرة القدم من مكان واحد.</p>
</div>
<div class="card">
<h2>⚽ مباريات اليوم</h2>
<p class="small">سيتم عرض المباريات هنا بعد ربط بيانات المباريات.</p>
</div>
<div class="card">
<h2>🏆 الدوريات</h2>
<p>الدوري المصري - الدوري الإنجليزي - الدوري الإسباني</p>
</div>
<div class="card">
<h2>🔔 الإشعارات</h2>
<p>استعد لمتابعة أهداف فريقك المفضل.</p>
</div>
</main>
<script>
function show(page){
let c=document.getElementById('content');
if(page==='home') location.reload();
if(page==='matches') c.innerHTML='<div class="card"><h2>⚽ المباريات</h2><p>قريباً: مواعيد ونتائج جميع المباريات.</p></div>';
if(page==='tables') c.innerHTML='<div class="card"><h2>🏆 ترتيب الدوريات</h2><p>قريباً: ترتيب الفرق والهدافين.</p></div>';
}
</script>
</body>
</html>
